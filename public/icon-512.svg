<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C6A15B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4B06A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8893D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E4435;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0F0D;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with subtle gradient -->
  <rect width="512" height="512" rx="96" fill="#0B0F0D"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.3"/>
  
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Inner circle with emerald gradient -->
  <circle cx="256" cy="256" r="200" fill="url(#emeraldGrad)"/>
  
  <!-- Decorative corner elements -->
  <path d="M 60 60 Q 80 60 80 80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <path d="M 452 60 Q 432 60 432 80" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <path d="M 60 452 Q 80 452 80 432" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <path d="M 452 452 Q 432 452 432 432" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  
  <!-- Open book - left page -->
  <path d="M 256 100 Q 155 120 130 230 Q 160 220 256 205 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Open book - right page -->
  <path d="M 256 100 Q 357 120 382 230 Q 352 220 256 205 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Book spine -->
  <line x1="256" y1="100" x2="256" y2="205" stroke="#0B0F0D" stroke-width="6"/>
  
  <!-- Text lines on left page -->
  <line x1="175" y1="145" x2="230" y2="140" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="180" y1="160" x2="240" y2="155" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="185" y1="175" x2="245" y2="170" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="190" y1="190" x2="250" y2="185" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  
  <!-- Text lines on right page -->
  <line x1="282" y1="140" x2="337" y2="145" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="272" y1="155" x2="332" y2="160" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="267" y1="170" x2="327" y2="175" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="262" y1="185" x2="322" y2="190" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  
  <!-- Crescent moon -->
  <path d="M 256 60 Q 278 75 278 100 Q 256 88 234 100 Q 234 75 256 60 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Star -->
  <polygon points="256,42 260,54 272,54 262,62 266,74 256,66 246,74 250,62 240,54 252,54" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Bottom decorative arch -->
  <path d="M 150 370 Q 256 400 362 370" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  <path d="M 170 385 Q 256 410 342 385" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Side decorative elements - left -->
  <path d="M 80 256 L 100 256 L 90 236 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M 80 256 L 100 256 L 90 276 Z" fill="url(#goldGrad)" opacity="0.3"/>
  
  <!-- Side decorative elements - right -->
  <path d="M 432 256 L 412 256 L 422 236 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M 432 256 L 412 256 L 422 276 Z" fill="url(#goldGrad)" opacity="0.3"/>
  
  <!-- Inner decorative circle -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Small decorative dots -->
  <circle cx="120" cy="120" r="4" fill="url(#goldGrad)" opacity="0.3"/>
  <circle cx="392" cy="120" r="4" fill="url(#goldGrad)" opacity="0.3"/>
  <circle cx="120" cy="392" r="4" fill="url(#goldGrad)" opacity="0.3"/>
  <circle cx="392" cy="392" r="4" fill="url(#goldGrad)" opacity="0.3"/>
</svg>
