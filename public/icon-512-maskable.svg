<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C6A15B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4B06A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A8893D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E4435;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0F0D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background - full bleed for maskable -->
  <rect width="512" height="512" fill="#0B0F0D"/>
  
  <!-- Safe zone circle (80% of 512 = 410px diameter, centered) -->
  <circle cx="256" cy="256" r="205" fill="url(#emeraldGrad)"/>
  
  <!-- Decorative ring within safe zone -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Open book - left page (within safe zone) -->
  <path d="M 256 120 Q 170 135 150 230 Q 175 220 256 210 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Open book - right page -->
  <path d="M 256 120 Q 342 135 362 230 Q 337 220 256 210 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Book spine -->
  <line x1="256" y1="120" x2="256" y2="210" stroke="#0B0F0D" stroke-width="5"/>
  
  <!-- Text lines on left page -->
  <line x1="185" y1="155" x2="235" y2="150" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="190" y1="170" x2="242" y2="165" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="195" y1="185" x2="248" y2="180" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="200" x2="252" y2="195" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  
  <!-- Text lines on right page -->
  <line x1="278" y1="150" x2="328" y2="155" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="272" y1="165" x2="322" y2="170" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="266" y1="180" x2="318" y2="185" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  <line x1="262" y1="195" x2="312" y2="200" stroke="#0B0F0D" stroke-width="2" opacity="0.4"/>
  
  <!-- Crescent moon (centered in safe zone) -->
  <path d="M 256 80 Q 275 92 275 115 Q 256 105 237 115 Q 237 92 256 80 Z" fill="url(#goldGrad)"/>
  
  <!-- Star (centered) -->
  <polygon points="256,65 259,75 269,75 261,81 264,91 256,85 248,91 251,81 243,75 253,75" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Bottom decorative arch (within safe zone) -->
  <path d="M 170 340 Q 256 365 342 340" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4"/>
  
  <!-- Side decorative elements (within safe zone) -->
  <path d="M 100 256 L 115 256 L 108 241 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M 100 256 L 115 256 L 108 271 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M 412 256 L 397 256 L 404 241 Z" fill="url(#goldGrad)" opacity="0.3"/>
  <path d="M 412 256 L 397 256 L 404 271 Z" fill="url(#goldGrad)" opacity="0.3"/>
</svg>
